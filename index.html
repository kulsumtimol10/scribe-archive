<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="An unofficial, fan-made world for Fourth Wing readers: find the dragon that chooses you, fly with Tairn, survive the Trials and talk theories in the Commons." />
    <meta name="theme-color" content="#07090d" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- How shared links look on TikTok, Instagram, iMessage, Discord and the rest. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Scribe Archive" />
    <meta property="og:title" content="The Scribe Archive" />
    <meta property="og:description" content="Find your dragon. Survive the Trials. Walk the field together. An unofficial, fan-made world for Fourth Wing readers." />
    <meta property="og:url" content="https://kulsumtimol10.github.io/scribe-archive/" />
    <meta property="og:image" content="https://kulsumtimol10.github.io/scribe-archive/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Scribe Archive: a black dragon flying past the moon over Basgiath at night" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>The Scribe Archive</title>
    <script>
      // Paint the reader's chosen sky before anything renders, so a returning
      // Storm & silver reader never sees a flash of Night & gold.
      try {
        var saved = localStorage.getItem('scribe-archive:theme');
        if (saved === 'night' || saved === 'storm') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
